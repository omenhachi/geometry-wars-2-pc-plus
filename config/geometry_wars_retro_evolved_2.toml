# ReXGlue runtime settings, read from <exe dir>/geometry_wars_retro_evolved_2.toml.
# Full (purchased) license for XamContentGetLicenseMask; the SDK default 0 means trial.
license_mask = 1
gpu_plugin = "xenos"

# Launcher and game window, centered on the primary display. Size is in logical pixels
# (scaled by Windows DPI) and is reduced to fit the display. The game sets the guest video mode from the launcher's
# Aspect Ratio, so it does not follow the window size.
fullscreen = false
monitor = 1
window_width = 1280
window_height = 720

# Keyboard and mouse controls on, matching the launcher's Keyboard setting, which shows On until it is changed (the
# SDK default is Off). A controller works alongside them.
mnk_mode = true

# Keyboard X and Y: How To Play and Leaderboard in the menus, so H and L instead of ReXGlue's L and P. The launcher's
# saved bindings take over once changed there.
keybind_x = "H"
keybind_y = "L"

# Bloom keeps its size above 1x resolution. ReXGlue's default (true) shrinks texture-fetch offsets by the resolution
# scale, so the bloom blur reaches half as far at 2x and a third at 3x, measured 10% and 16% less glow around the title
# than at 1x; false keeps the game's own relative blur, within 2% of 1x at both. Only the bloom and its downsampling
# use offsets, and with bloom off a 2x frame is unchanged. Thanks to the community write-up
# (BLOOM_RESOLUTION_SCALING) that found it. No effect at 1x, or on Vulkan, which never shrinks them.
draw_resolution_scaled_texture_offsets = false

# Audio frames queued ahead of playback (ReXGlue's default is 8). 16 keeps the sound in step through busy modes like
# Evolved and Sequence, at about 43 ms more delay.
audio_maxqframes = 16
